name: desktop

on:
  push:
    branches: [main]
    paths: ["agent/**", "desktop/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["agent/**", "desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # pushes to this repository sign; pull requests (no secrets) build unsigned
      SIGNING: ${{ github.event_name != 'pull_request' && 'Required' || 'Skip' }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Import the pinned signing identity
        if: env.SIGNING == 'Required'
        shell: pwsh
        env:
          WINHAND_WINDOWS_PFX_BASE64: ${{ secrets.WINHAND_WINDOWS_PFX_BASE64 }}
          WINHAND_WINDOWS_PFX_PASSWORD: ${{ secrets.WINHAND_WINDOWS_PFX_PASSWORD }}
        run: ./desktop/scripts/Import-WindowsSigningIdentity.ps1
      - name: Signing checks (wrong password/certificate, tampered content, signature and timestamp)
        if: env.SIGNING == 'Required'
        shell: pwsh
        env:
          WINHAND_WINDOWS_PFX_BASE64: ${{ secrets.WINHAND_WINDOWS_PFX_BASE64 }}
          WINHAND_WINDOWS_PFX_PASSWORD: ${{ secrets.WINHAND_WINDOWS_PFX_PASSWORD }}
        run: ./desktop/scripts/Test-WindowsSigning.ps1
      # backend binary (smoke-tested without Python) + self-contained WinUI app + Velopack installer
      - name: Build app, portable zip and installer
        shell: pwsh
        run: ./desktop/scripts/Build-Windows.ps1 -Zip -Installer -SigningMode $env:SIGNING
      - uses: actions/upload-artifact@v7
        with:
          name: winhand-windows-x64
          path: |
            desktop/out/*.zip
            desktop/out/releases/*
            desktop/out/signatures.json
          if-no-files-found: ignore
