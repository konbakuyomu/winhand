name: relay

on:
  push:
    branches: [main]
    paths: ["relay/**", "agent/**", ".github/workflows/relay.yml"]
  pull_request:
    paths: ["relay/**", "agent/**", ".github/workflows/relay.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - name: Install
        run: |
          npm ci --prefix relay
          uv sync --locked --project agent
      - name: Typecheck relay
        run: npm run typecheck --prefix relay
      - name: End-to-end (OAuth + tunnel + MCP) against wrangler dev
        working-directory: relay
        run: |
          printf 'OWNER_PASSPHRASE="test-passphrase-123"\nAGENT_TOKEN="test-agent-token-456"\n' > .dev.vars
          npx wrangler dev --port 8787 --ip 127.0.0.1 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/ >/dev/null && break; sleep 1; done
          uv run --project ../agent python test/e2e.py || (cat wrangler.log; exit 1)
