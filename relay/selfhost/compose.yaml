services:
  relay:
    image: winhand-relay:20261113
    network_mode: host
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    command: ["node", "selfhost/serve.mjs"]
    environment:
      PUBLIC_ORIGIN: https://${WINHAND_HOST:?set WINHAND_HOST to the relay's domain}
      WINHAND_STATE_DIR: /state
      OWNER_PASSPHRASE_FILE: /run/secrets/owner-passphrase
      AGENT_TOKEN_FILE: /run/secrets/agent-token
      PROXY_TOKEN_FILE: /run/secrets/proxy-token
    volumes:
      - ./secrets:/run/secrets:ro
      - ./state:/state
      - ./generated:/app/dist
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  https:
    image: caddy:2-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    network_mode: host
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    depends_on: [relay]
    environment:
      WINHAND_HOST: ${WINHAND_HOST:?set WINHAND_HOST to the relay's domain}
      PROXY_TOKEN: ${PROXY_TOKEN:?required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
      - ./caddy-config:/config
    security_opt: ["no-new-privileges:true"]
